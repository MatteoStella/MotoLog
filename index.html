<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyGarage</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com; manifest-src 'self'; base-uri 'self'; form-action 'self';">
<meta name="theme-color" content="#121214">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js" integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#121214;
    --bg-rgb:18,18,20;
    --bg-2:#18181B;
    --surface:#1C1C21;
    --surface-2:#232328;
    --border:#313136;
    --text:#EDEDEF;
    --text-muted:#8B8B93;
    --accent:#2F80FF;
    --accent-dim:rgba(47,128,255,.16);
    --on-accent:#FFFFFF;
    --accent-shadow-rgb:47,128,255;
    --ok:#2ED47A;
    --ok-dim:rgba(46,212,122,.16);
    --warn:#E8A33D;
    --warn-dim:rgba(232,163,61,.14);
    --danger:#E4483C;
    --danger-dim:rgba(228,72,60,.14);
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;overflow-x:hidden;}
  body{-webkit-font-smoothing:antialiased;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(88px + var(--safe-bottom));}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-.01em;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .muted{color:var(--text-muted);}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  a{color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:11px 12px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;margin-top:14px;}
  label:first-child{margin-top:0;}
  .field{margin-bottom:2px;}
  .btn{border:none;border-radius:var(--radius-sm);padding:12px 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--danger-dim);color:var(--danger);}
  .btn-block{width:100%;}
  .icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* Header */
  .topbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 60%,transparent);padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-size:20px;}
  .topbar .actions{display:flex;gap:10px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);}

  /* Vehicle switcher */
  .veh-switcher{display:flex;gap:10px;overflow-x:auto;padding:4px 18px 14px;scroll-snap-type:x mandatory;}
  .veh-switcher::-webkit-scrollbar{display:none;}
  .veh-chip{scroll-snap-align:start;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .veh-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

  .content{padding:0 18px 24px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:22px 0 10px;display:flex;align-items:center;gap:7px;}
  .section-title::before{content:'';display:inline-block;width:10px;height:2px;background:var(--accent);border-radius:2px;flex-shrink:0;}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.05);}
  .card + .card{margin-top:10px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .card-tap{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);transition:transform .12s ease;}
  .card-tap:active, .log-item:active{transform:scale(.985);}

  /* Gauge cluster */
  .gauge-hero{position:relative;z-index:0;display:flex;flex-direction:column;align-items:center;padding:24px 16px 12px;overflow:hidden;}
  .gauge-hero::before{content:'';position:absolute;z-index:-1;top:-90px;left:50%;transform:translateX(-50%);width:260px;height:260px;background:radial-gradient(circle, var(--accent) 0%, transparent 68%);opacity:.14;pointer-events:none;}
  .gauge-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .gauge-mini{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.05);}

  /* Banner */
  .banner{background:var(--warn-dim);border:1px solid rgba(232,163,61,.35);border-radius:var(--radius);padding:14px 14px;display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .banner-icon{color:var(--warn);flex-shrink:0;}
  .banner-text{flex:1;font-size:14px;}
  .banner-close{background:none;border:none;color:var(--text-muted);padding:4px;}

  /* Empty state */
  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty .icon{width:40px;height:40px;margin-bottom:12px;opacity:.6;}

  /* Chips / filters */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--text-muted);}
  .chip.active{background:var(--surface-2);color:var(--text);border-color:var(--text-muted);}

  /* Log items */
  .log-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);}
  .log-item:last-child{border-bottom:none;}
  .log-dot{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .log-body{flex:1;min-width:0;}
  .log-title{font-size:14.5px;font-weight:500;}
  .log-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .log-meta{font-size:12px;color:var(--text-muted);white-space:nowrap;}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;}
  .badge-ok{background:var(--ok-dim);color:var(--ok);}
  .badge-warn{background:var(--warn-dim);color:var(--warn);}
  .badge-danger{background:var(--danger-dim);color:var(--danger);}

  /* Tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(var(--bg-rgb),.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-bottom));z-index:10;max-width:520px;margin:0 auto;}
  .tab-item{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-muted);font-size:10.5px;padding:6px 14px;border-radius:12px;}
  .tab-item.active{color:var(--accent);}
  .fab{position:fixed;right:calc(50% - 260px + 18px);bottom:calc(78px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:11;}
  @media (max-width:559px){ .fab{right:18px;} }

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,9,7,.7);z-index:20;display:flex;align-items:flex-end;}
  .modal-sheet{background:var(--bg-2);border-radius:20px 20px 0 0;width:100%;max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:20px 18px calc(24px + var(--safe-bottom));animation:slideup .22s ease-out;}
  @keyframes slideup{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-header h2{font-size:18px;}
  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .type-opt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);font-size:13px;font-weight:500;}
  .type-opt .icon{width:26px;height:26px;color:var(--accent);}

  .attach-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .attach-thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;}
  .attach-thumb img{width:100%;height:100%;object-fit:cover;}
  .attach-remove{position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .actions-footer{display:flex;gap:10px;margin-top:20px;}

  /* Chat */
  .chat-scroll{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;}
  .msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.45;}
  .msg-user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;}
  .msg-ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .chat-input-row{position:sticky;bottom:0;display:flex;gap:8px;background:var(--bg);padding:10px 0 4px;}

  .toast{position:fixed;bottom:calc(96px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 18px 9px 10px;border-radius:999px;font-size:13px;z-index:30;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);}
  .check-badge{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideInFwd{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
  @keyframes slideInBack{from{opacity:0;transform:translateX(-28px);}to{opacity:1;transform:translateX(0);}}
  .content-enter-fwd{animation:slideInFwd .3s cubic-bezier(.25,.8,.35,1);}
  .content-enter-back{animation:slideInBack .3s cubic-bezier(.25,.8,.35,1);}

  .sub-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;}
  .sub-tab{flex:1;background:none;border:none;padding:9px;border-radius:9px;font-size:13px;color:var(--text-muted);font-weight:500;}
  .sub-tab.active{background:var(--surface-2);color:var(--text);}

  .proposal-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
  .proposal-item:last-child{border-bottom:none;}
  .checkbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .checkbox.checked{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module" src="app.js"></script>
</body>
</html>
